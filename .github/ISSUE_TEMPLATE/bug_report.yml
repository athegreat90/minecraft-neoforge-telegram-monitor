name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste your bot token, your `.env`, or logs that might contain a token.**
        The monitor redacts tokens in its own logs, but read everything before posting it.
        For security problems use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran (with placeholders instead of real ids and tokens).
  - type: input
    id: version
    attributes:
      label: Version or image tag
      description: Output of `release-monitor version`, or the `IMAGE_TAG` you run.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux amd64
        - Linux arm64 (for example Raspberry Pi)
        - NAS
        - Docker Desktop on Windows
        - Docker Desktop on macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Only the relevant lines, checked by you for secrets. `docker compose logs --tail=100 release-monitor`
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed any token, `.env` content and other secrets from this report.
          required: true

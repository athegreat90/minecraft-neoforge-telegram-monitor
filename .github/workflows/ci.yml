name: CI

# Pull requests, manual runs and reuse by other workflows (workflow_call).
#
# There is deliberately NO `push` trigger: docker-publish.yml calls this workflow on every push
# to main and on release tags, so a push trigger here would run the whole suite twice.
#
# Required status checks for the `main` ruleset (names as they appear on a pull request):
#   Lint, Type check, Tests (floor), Tests (current), Docker build, Compose validate,
#   Secret scan, Dependency audit, Image scan, Workflow lint, PR title
# When this workflow is called from another workflow GitHub prefixes them with "ci / ".

on:
  pull_request:
    # `edited` re-runs the PR title check when the title is fixed.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Distinct from docker-publish's own group so a caller and this workflow can never deadlock.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.0"
  # The image tag is local to the runner; nothing in this workflow is ever pushed.
  CI_IMAGE: minecraft-neoforge-telegram-monitor:ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lock file is up to date
        run: |
          uv lock --check || {
            echo "::error title=uv.lock is stale::pyproject.toml and uv.lock disagree. Run 'uv lock' and commit the result."
            exit 1
          }
      - name: Ruff lint
        run: |
          uv run ruff check || {
            echo "::error title=ruff check failed::Fix the findings above. Locally: 'uv run ruff check --fix'."
            exit 1
          }
      - name: Ruff format
        run: |
          uv run ruff format --check || {
            echo "::error title=ruff format failed::Run 'uv run ruff format' and commit the result."
            exit 1
          }

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: mypy (strict)
        run: |
          uv run mypy || {
            echo "::error title=mypy failed::Fix the type errors above. Locally: 'uv run mypy'."
            exit 1
          }

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The supported floor, taken from `requires-python` in pyproject.toml.
          - name: floor
            python: "3.14"
          # Empty: uv reads the exact interpreter from `.python-version`, which is the single
          # place Renovate bumps, so an upgrade PR exercises the new Python right here.
          - name: current
            python: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Show interpreter
        run: uv run python --version
      - name: pytest (warnings are errors, coverage gate 85%)
        run: |
          uv run pytest -W error --cov --cov-report=term-missing --cov-fail-under=85 || {
            echo "::error title=tests failed::A test failed or total coverage dropped below 85%. Reproduce with 'uv run pytest -W error --cov'."
            exit 1
          }

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Smoke test - runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id "$CI_IMAGE" -u)"
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error title=image runs as root::The runtime stage must set a non-root USER."
            exit 1
          fi
      - name: Smoke test - no .env and no secret-like files in the image
        run: |
          # Public CA bundles (*.pem, *.crt) legitimately ship with Python and are not matched.
          found="$(docker run --rm --entrypoint sh "$CI_IMAGE" -c '
            find / -xdev \( -path /proc -o -path /sys \) -prune -o \
              \( -name ".env" -o -name ".env.*" -o -name "*.key" -o -name "*.p12" \
                 -o -name "*.pfx" -o -name "*.secret" -o -name "*.sqlite" \
                 -o -name "*.sqlite3" -o -name "*.db" \) -print 2>/dev/null
            test -e /app/.env && echo /app/.env
            true
          ')"
          if [ -n "$found" ]; then
            echo "::error title=secret-like files in the image::Remove them from the build context (.dockerignore):"
            echo "$found"
            exit 1
          fi
          echo "no .env or secret-like files found"
      - name: Smoke test - CLI starts
        run: docker run --rm "$CI_IMAGE" version
      - name: Smoke test - healthcheck reports an instance that never polled as unhealthy
        run: |
          # A valid (fake) configuration, so the failure is about the missing heartbeat and
          # not about the environment.
          set +e
          out="$(docker run --rm \
            -e TELEGRAM_BOT_TOKEN=123456:AAFAKE-token_value \
            -e MINECRAFT_CHANNEL_ID=@FakeMinecraft -e NEOFORGE_CHANNEL_ID=@FakeNeoForge \
            "$CI_IMAGE" healthcheck 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ] || [ "$out" != "unhealthy: no heartbeat yet" ]; then
            echo "::error title=healthcheck misbehaves::Expected 'unhealthy: no heartbeat yet' with exit code 1, got exit code $rc."
            exit 1
          fi
      - name: Smoke test - graceful shutdown on SIGTERM, hardened runtime, no token in logs
        run: |
          token="123456:AAFAKE-token_value"
          cid="$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp \
            -e TELEGRAM_BOT_TOKEN="$token" -e MINECRAFT_CHANNEL_ID=@FakeMinecraft \
            -e NEOFORGE_CHANNEL_ID=@FakeNeoForge "$CI_IMAGE")"
          sleep 8
          if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
            echo "::error title=container exited early::Logs follow."
            docker logs "$cid" 2>&1 | sed -e "s/$token/<redacted>/g"
            docker rm -f "$cid" >/dev/null
            exit 1
          fi
          start="$SECONDS"
          docker stop --time 10 "$cid" >/dev/null
          elapsed=$((SECONDS - start))
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
          logs="$(docker logs "$cid" 2>&1)"
          docker rm -f "$cid" >/dev/null
          echo "stop took ${elapsed}s, exit code ${exit_code}"
          if [ "$elapsed" -ge 5 ] || [ "$exit_code" != "0" ]; then
            echo "::error title=no graceful shutdown::SIGTERM must stop the container quickly with exit code 0."
            exit 1
          fi
          case "$logs" in
            *"$token"*)
              echo "::error title=token leaked into logs::The bot token must never appear in log output."
              exit 1
              ;;
          esac
      - name: Save the image for the scan job
        run: docker save "$CI_IMAGE" --output image.tar
      - name: Upload the image for the scan job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  compose-validate:
    name: Compose validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate both compose files with dummy values
        run: |
          # Only fake values exist here; --env-file also stops Compose from reading a stray .env.
          env_file="$RUNNER_TEMP/ci.env"
          printf '%s\n' \
            'TELEGRAM_BOT_TOKEN=123456:AAFAKE-token_value' \
            'MINECRAFT_CHANNEL_ID=@FakeMinecraft' \
            'NEOFORGE_CHANNEL_ID=@FakeNeoForge' > "$env_file"
          for file in compose.yaml compose.prod.yaml; do
            docker compose --env-file "$env_file" -f "$file" config --quiet || {
              echo "::error title=$file is invalid::Run 'docker compose --env-file <fake env> -f $file config -q' locally."
              exit 1
            }
            echo "$file: valid"
          done
      - name: Required variables are enforced
        run: |
          empty="$RUNNER_TEMP/empty.env"
          : > "$empty"
          if docker compose --env-file "$empty" -f compose.yaml config --quiet 2>/dev/null; then
            echo "::error title=missing variables accepted::compose.yaml must fail when a required variable is unset."
            exit 1
          fi
          echo "compose.yaml rejects an empty environment, as intended"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Bump version and checksum together (checksums_txt of the release). Renovate proposes the
      # version; the checksum check then fails on purpose until a human updates the hash.
      # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: gitleaks over the full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose . || {
            echo "::error title=possible secret in history::Treat any real credential as compromised: revoke it first, then clean the history."
            exit 1
          }
      - name: No secret-bearing files tracked
        run: |
          bash scripts/git-safety-check.sh || {
            echo "::error title=secret-bearing file tracked::Run 'git rm --cached <file>' (keep your local copy) and make sure .gitignore covers it."
            exit 1
          }
      - name: Forbidden file names in the tree
        run: |
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|secret|sqlite3?|db)$|(^|/)(secrets|credentials)/' \
            | grep -Ev '^(\.env\.example|docs/env\.example)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error title=forbidden files are tracked::These paths must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "no forbidden file names are tracked"

  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: pip-audit against the locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt" \
            --disable-pip --no-deps --strict || {
            echo "::error title=vulnerable dependency::Upgrade the affected package (uv lock --upgrade-package <name>) and commit uv.lock."
            exit 1
          }
      - name: Dependency review (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image-scan:
    name: Image scan
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the image built in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
      # Trivy is third-party code that reads our image, so the action is pinned to a full commit
      # SHA, the scanner version is pinned explicitly, and its own cache is off (a poisoned
      # cache would otherwise survive between runs).
      - name: Trivy - vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: image.tar
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0
          cache: "false"

  workflows-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same rule as the gitleaks pins: version and checksum change together.
      # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.*)$
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      # renovate: datasource=github-releases depName=hadolint/hadolint extractVersion=^v(?<version>.*)$
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install actionlint and hadolint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color || {
            echo "::error title=actionlint failed::Fix the workflow syntax or expression errors above."
            exit 1
          }
      - name: zizmor (workflow security audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv tool run --from "zizmor==${ZIZMOR_VERSION}" zizmor .github/workflows || {
            echo "::error title=zizmor findings::Fix the workflow security findings above (pin actions, narrow permissions, avoid template injection)."
            exit 1
          }
      - name: hadolint
        run: |
          "$RUNNER_TEMP/hadolint" Dockerfile || {
            echo "::error title=hadolint findings::Fix the Dockerfile findings above."
            exit 1
          }

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, and release-please reads those
      # commits, so the title must be a Conventional Commit (feat: ..., fix: ..., chore: ...).
      - name: Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

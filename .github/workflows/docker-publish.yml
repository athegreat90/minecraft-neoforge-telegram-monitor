name: Docker publish

# Publishes ghcr.io/athegreat90/minecraft-neoforge-telegram-monitor.
#
#   push to main      -> :edge and :sha-<commit>            (never :latest)
#   tag v1.2.3        -> :1.2.3 :1.2 :1 :latest :sha-<commit>
#   tag v1.2.3-rc.1   -> :1.2.3-rc.1 :sha-<commit>          (pre-releases never move :latest)
#   workflow_call     -> used by release.yml, because a tag created with GITHUB_TOKEN does not
#                        trigger another workflow on its own
#
# Nothing is published unless the full CI workflow passed first, and never from a pull request.
# Protect the `v*` tags with a repository ruleset so that only maintainers can create them.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/athegreat90/minecraft-neoforge-telegram-monitor

jobs:
  ci:
    name: ci
    permissions:
      contents: read
      pull-requests: read
    # The newer `$/` self-repository form is not confirmed by GitHub's own docs yet, so keep `./`.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  publish:
    name: Publish image
    needs: ci
    # Only this repository, and only from main or a release tag: a manual run from a feature
    # branch must not be able to publish unreviewed code.
    if: >-
      github.repository == 'athegreat90/minecraft-neoforge-telegram-monitor'
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Decide what is being released
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=""
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          fi
          is_release=false
          is_stable=false
          if [ -n "$tag" ]; then
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error title=bad release tag::'$tag' is not vMAJOR.MINOR.PATCH[-prerelease]."
              exit 1
            fi
            is_release=true
            if printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              is_stable=true
            fi
          fi
          {
            echo "tag=$tag"
            echo "is_release=$is_release"
            echo "is_stable=$is_stable"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the code to publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.tag || github.sha }}
          persist-credentials: false
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.is_release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.is_stable }}
            type=semver,pattern={{major}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.is_stable }}
            type=raw,value=latest,enable=${{ steps.ref.outputs.is_stable }}
            type=edge,branch=main
            type=sha,prefix=sha-
      # Build one native image first and scan it BEFORE anything is pushed. The multi-arch push
      # below reuses the layer cache, so this costs little.
      - name: Build the amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-candidate:local
          cache-from: type=gha,scope=publish
      # Third-party scanner: pinned by commit SHA, explicit scanner version, no scanner cache.
      - name: Trivy - vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: scan-candidate:local
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0
          cache: "false"
      - name: Build and push the multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            while IFS= read -r published_tag; do
              echo "- \`${published_tag}\`"
            done <<< "$TAGS"
            echo
            echo "Verify: \`gh attestation verify oci://${IMAGE}@${DIGEST} --owner athegreat90\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release

# release-please turns Conventional Commits on main into a release pull request. Merging that
# pull request creates the vX.Y.Z tag and GitHub Release, then this workflow publishes the image.
#
# Why the publish step is a direct call and not "on: push: tags":
#   a tag or release created with the workflow's GITHUB_TOKEN does NOT trigger other workflows,
#   so docker-publish.yml is called here (workflow_call) with the new tag instead.
#
# Why the sync-lock job exists:
#   release-please bumps the version in pyproject.toml, but uv.lock also records the project's own
#   version and release-please cannot edit it (its TOML updater does not handle the [[package]]
#   array). Without the sync, `uv lock --check` fails on every release pull request.
#
# Known limitation: for the same GITHUB_TOKEN reason, neither the release pull request nor the
# lock sync commit starts CI runs. After the release pull request appears (or is updated), close
# and reopen it yourself so the required checks run as a real pull_request event:
#   gh pr close <n> && gh pr reopen <n>

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'athegreat90/minecraft-neoforge-telegram-monitor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: ${{ steps.release.outputs.prs != '' && fromJSON(steps.release.outputs.prs)[0].headBranchName || '' }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-lock:
    name: Sync uv.lock on release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      UV_VERSION: "0.13.0"
      RELEASE_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
    steps:
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Refresh uv.lock and push it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject.toml; nothing to push."
            exit 0
          fi
          git diff --stat -- uv.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${RELEASE_BRANCH}"

  publish-image:
    name: Publish release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      pull-requests: read
      packages: write
      attestations: write
      id-token: write
    # The newer `$/` self-repository form is not confirmed by GitHub's own docs yet, so keep `./`.
    uses: ./.github/workflows/docker-publish.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

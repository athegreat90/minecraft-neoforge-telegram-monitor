name: Security

# Weekly deep scan. New CVEs and leaked-secret rules appear without any code change, so the
# published image and the dependency set are re-checked on a schedule, not only on pull requests.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  IMAGE: ghcr.io/athegreat90/minecraft-neoforge-telegram-monitor

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same pins as ci.yml: bump version and checksum together.
      # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: gitleaks over the full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose . || {
            echo "::error title=possible secret in history::Treat any real credential as compromised: revoke it first, then clean the history."
            exit 1
          }

  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: pip-audit against the locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt" \
            --disable-pip --no-deps --strict

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv tool run --from "zizmor==${ZIZMOR_VERSION}" zizmor .github/workflows

  published-image:
    name: Published image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the latest published image, if there is one
        id: pull
        run: |
          if docker pull "${IMAGE}:latest" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=nothing to scan::${IMAGE}:latest does not exist yet (no release has been published). Skipping the image scan."
          fi
      # Third-party scanner: pinned by commit SHA, explicit scanner version, no scanner cache.
      - name: Trivy - vulnerabilities and secrets
        if: steps.pull.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:latest
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0
          cache: "false"

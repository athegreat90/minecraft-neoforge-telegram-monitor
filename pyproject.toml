[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minecraft-neoforge-telegram-monitor"
version = "0.1.0"
description = "Posts new Minecraft Java Edition and NeoForge releases to two Telegram channels."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "athegreat90" }]
keywords = ["minecraft", "neoforge", "telegram", "release-monitor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "tzdata>=2025.2",
]

[project.scripts]
release-monitor = "release_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/athegreat90/minecraft-neoforge-telegram-monitor"
Issues = "https://github.com/athegreat90/minecraft-neoforge-telegram-monitor/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/release_monitor"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to real external services; opt-in with --run-live (skipped by default)",
]

[tool.coverage.run]
source = ["release_monitor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
